name: Build SumBeat APK

# Builds the Android APK on GitHub's own Linux runner, so you don't need
# a Linux machine, WSL, or any local Android/NDK setup at all.
#
# Runs automatically on every push to main, and can also be triggered by
# hand from the Actions tab ("Run workflow").

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out the project
        uses: actions/checkout@v4

      - name: Build with Buildozer
        uses: ArtemSBulgakov/buildozer-action@v1
        id: buildozer
        with:
          command: buildozer android debug
          buildozer_version: stable

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: sumbeat-apk
          path: ${{ steps.buildozer.outputs.filename }}
